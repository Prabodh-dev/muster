# Example config: run `muster` from the repository root.
#
# Every command here goes through `go run`, so it behaves the same under
# /bin/sh and cmd.exe. Your own commands are handed to the OS's default shell
# as-is, so keep shell-specific syntax out of a config you share across
# platforms (see "Commands and the shell" in the README).

grace_period_seconds: 5
stats_interval_seconds: 2   # CPU/memory sampling; 0 turns it off

logs:
  enabled: true             # write each process's output to .muster/logs/<name>.log

processes:
  clock:
    command: go run ./examples/demo/main.go -name clock -every 1s -listen 127.0.0.1:47001
    # muster checks this port before starting anything and warns if
    # something else already has it.
    ports: [47001]

  greeter:
    command: go run ./examples/demo/main.go -name greeter -count 2
    env:
      GREETING: hi from muster

  flaky:
    # Exits non-zero after a few lines; muster brings it back with backoff
    # until max_restarts is used up.
    command: go run ./examples/demo/main.go -name flaky -count 3 -exit 1
    restart: on-failure
    max_restarts: 3
